name: Sync Upstream and Build Loon Rules

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Sunday at 00:00 UTC (08:00 Beijing Time)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuilding all rulesets'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Rulesets and Diagnostics
        run: |
          python scripts/build.py

      - name: Run Integrity and Anti-Collision Tests
        run: |
          python -B -m unittest scripts.test_rules

      - name: Run Diagnostic Plugin Fixture Tests
        run: |
          node --test tests/test_diagnostic.js

      - name: Pre-Release Local Integrity Gate (Fail-Stop Release Barrier)
        # Strict local barrier: stops pipeline BEFORE git commit or push if any rule,
        # hash, policy token, or diagnostic artifact check fails.
        # Remote repository, main branch, and CDN mirrors remain 100% untouched on failure.
        run: |
          python scripts/verify_mirrors.py --pre-release

      - name: Commit and Push if Changed
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ sources.yml scripts/upstream_lock.json
          if git diff --staged --quiet; then
            echo "No rule changes detected. Skipping commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(rules): sync upstream and rebuild rules [$TIMESTAMP]"
            git tag "release-$(date -u +"%Y%m%d-%H%M%S")"
            git push origin HEAD --tags
          fi

      - name: Post-Release Mirrors and CDN Health Alert Gate
        # Health check & alert gate: Runs after push to verify edge propagation and CDN mirror consistency.
        # NOTE: If remote CDN or edge replication fails, this step exits with code 1 and flags the job red
        # to alert maintainers. Per CI/CD architectural reality, it does NOT perform destructive git force-push
        # rollbacks on public branches.
        if: github.event_name != 'pull_request'
        run: |
          # Grace period for GitHub Raw edge cache replication
          sleep 10
          python scripts/verify_mirrors.py --branch ${{ github.ref_name }}
