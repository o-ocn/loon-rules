name: Sync Upstream and Build Loon Rules

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Sunday at 00:00 UTC (08:00 Beijing Time)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuilding all rulesets'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Rulesets and Diagnostics
        run: |
          python scripts/build.py

      - name: Run Integrity and Anti-Collision Tests
        run: |
          python -B -m unittest scripts.test_rules

      - name: Run Cross-Border Shared Infrastructure and Collision Check
        run: |
          python scripts/check_conflicts.py --strict

      - name: Run Diagnostic Plugin Fixture Tests
        run: |
          node --test tests/test_diagnostic.js

      - name: Run Telegram Alert Suite and Health Contract Tests
        run: |
          python -B -m unittest tests/test_telegram_alerts.py tests/test_notification_guards.py tests/test_pages_release.py

      - name: Pre-Release Local Integrity Gate (Fail-Stop Release Barrier)
        # Strict local barrier: stops pipeline BEFORE git commit or push if any rule,
        # hash, policy token, or diagnostic artifact check fails.
        # Remote repository, main branch, and CDN mirrors remain 100% untouched on failure.
        run: |
          python scripts/verify_mirrors.py --pre-release

      - name: Commit and Push if Changed
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ sources.yml scripts/upstream_lock.json
          if git diff --staged --quiet; then
            echo "No rule changes detected. Skipping commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(rules): sync upstream and rebuild rules [$TIMESTAMP]"
            git tag "release-$(date -u +"%Y%m%d-%H%M%S")"
            git push origin HEAD --tags
          fi

      - name: Post-Release Mirrors and CDN Health Alert Gate
        # Health check & alert gate: Runs after push to verify edge propagation and CDN mirror consistency.
        # Uses --soft-cdn: GitHub Raw is the primary hard gate; jsDelivr CDN propagation latency emits
        # an advisory warning rather than failing the release.
        if: github.event_name != 'pull_request'
        run: |
          # Grace period for GitHub Raw edge cache replication
          sleep 10
          python scripts/verify_mirrors.py --branch ${{ github.ref_name }} --soft-cdn

      - name: Upload Verified Pages Bundle
        if: github.event_name != 'pull_request' && github.repository == 'o-ocn/loon-rules' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: loon-rules-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  pages-deploy:
    name: Cloudflare Pages deployment
    needs: build-and-validate
    if: github.event_name != 'pull_request' && github.repository == 'o-ocn/loon-rules' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: loon-rules-pages-production
      cancel-in-progress: false
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Pages deployment credentials are missing. The separate rule publication job has completed."
            exit 1
          fi

      - name: Checkout verification tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download verified release from this run
        uses: actions/download-artifact@v4
        with:
          name: loon-rules-dist
          path: pages-dist

      - name: Verify downloaded release integrity
        run: |
          python -B -c "from scripts.verify_mirrors import verify_local_pre_release; verify_local_pre_release(dist_dir='pages-dist', manifest_path='pages-dist/diagnostics/manifest.json')"

      - name: Check release is current before deployment
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/verify_pages_release.py --dist-dir pages-dist --check-current

      - name: Deploy verified release to Cloudflare Pages
        if: steps.current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 pages deploy pages-dist --project-name loon-rules --branch main --commit-dirty=true

      - name: Verify public Cloudflare Pages release
        if: steps.current.outputs.current == 'true'
        run: python -B scripts/verify_pages_release.py --dist-dir pages-dist
