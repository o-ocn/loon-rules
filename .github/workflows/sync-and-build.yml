name: Sync Upstream and Build Loon Rules

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Sunday at 00:00 UTC (08:00 Beijing Time)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuilding all rulesets'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Rulesets and Diagnostics
        run: |
          python scripts/build.py

      - name: Run Integrity and Anti-Collision Tests
        run: |
          python -B -m unittest scripts.test_rules

      - name: Run Cross-Border Shared Infrastructure and Collision Check
        run: |
          python scripts/check_conflicts.py --strict

      - name: Run Diagnostic Plugin Fixture Tests
        run: |
          node --test tests/test_diagnostic.js

      - name: Run Telegram Alert Suite and Health Contract Tests
        run: |
          python -B -m unittest tests/test_telegram_alerts.py tests/test_notification_guards.py

      - name: Pre-Release Local Integrity Gate (Fail-Stop Release Barrier)
        # Strict local barrier: stops pipeline BEFORE git commit or push if any rule,
        # hash, policy token, or diagnostic artifact check fails.
        # Remote repository, main branch, and CDN mirrors remain 100% untouched on failure.
        run: |
          python scripts/verify_mirrors.py --pre-release

      - name: Commit and Push if Changed
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ sources.yml scripts/upstream_lock.json
          if git diff --staged --quiet; then
            echo "No rule changes detected. Skipping commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(rules): sync upstream and rebuild rules [$TIMESTAMP]"
            git tag "release-$(date -u +"%Y%m%d-%H%M%S")"
            git push origin HEAD --tags
          fi

      - name: Deploy dist to Cloudflare Pages (loon-rules)
        # Deploys verified dist/ to Cloudflare Pages upon successful build and test pass on main
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '18fa061db5a3468e2b7b94f73412630e' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error ::Missing CLOUDFLARE_API_TOKEN in GitHub Actions Secrets. Production Cloudflare Pages deployment halted."
            exit 1
          fi
          echo "Deploying dist/ to Cloudflare Pages project 'loon-rules'..."
          npx wrangler pages deploy dist --project-name loon-rules --commit-dirty=true
          echo "Cloudflare Pages deployment for loon-rules succeeded."

      - name: Post-Release Mirrors and CDN Health Alert Gate
        # Health check & alert gate: Runs after push to verify edge propagation and CDN mirror consistency.
        # Uses --soft-cdn: GitHub Raw is the primary hard gate; jsDelivr CDN propagation latency emits
        # an advisory warning rather than failing the release.
        if: github.event_name != 'pull_request'
        run: |
          # Grace period for GitHub Raw edge cache replication
          sleep 10
          python scripts/verify_mirrors.py --branch ${{ github.ref_name }} --soft-cdn
