# Declarative Upstream Sources Configuration
# All upstreams are strictly READ-ONLY.
# Primary Upstream: blackmatrix7/ios_rule_script (GPL-2.0)
# Secondary Reference: luestr/ShuntRules (Cites blackmatrix7, used solely as structural reference)
# Strategy Neutrality: All rulesets are pure service classifications without bound policies.

metadata:
  primary_upstream:
    name: "blackmatrix7/ios_rule_script"
    repo: "https://github.com/blackmatrix7/ios_rule_script"
    raw_base: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon"
    license: "GPL-2.0"
  secondary_upstream:
    name: "luestr/ShuntRules"
    repo: "https://github.com/luestr/ShuntRules"
    note: "Structural reference only. Actual rule files are fetched directly from blackmatrix7 git raw to avoid 403 blocks."
  max_shrink_ratio: 0.15

rulesets:
  AI-Overseas:
    description: "Overseas AI services (ChatGPT, Claude, Gemini, Grok, Muse from Meta)"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "OpenAI"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/OpenAI/OpenAI.list"
        min_rules: 15
        filter_excluded:
          # Shared payment gateway (prevents payment failures across non-AI web)
          - "DOMAIN-SUFFIX,stripe.com"
          # Shared authentication provider
          - "DOMAIN-SUFFIX,auth0.com"
          # Shared SaaS / Telemetry / Error tracking
          - "DOMAIN-SUFFIX,sentry.io"
          - "DOMAIN-SUFFIX,intercom.io"
          - "DOMAIN-SUFFIX,intercomcdn.com"
          - "DOMAIN-SUFFIX,launchdarkly.com"
          - "DOMAIN-SUFFIX,segment.io"
          - "DOMAIN-SUFFIX,observeit.net"
          - "DOMAIN-SUFFIX,identrust.com"
          - "DOMAIN-SUFFIX,algolia.net"
          - "DOMAIN-SUFFIX,api.statsig.com"
          - "DOMAIN-SUFFIX,events.statsigapi.net"
          - "DOMAIN-SUFFIX,featuregates.org"
          - "DOMAIN,browser-intake-datadoghq.com"
          - "DOMAIN,static.cloudflareinsights.com"
          # Shared hosting / broad ASN exclusions (Vultr AS20473 & DigitalOcean IPs)
          - "IP-ASN,20473,no-resolve"
          - "IP-CIDR,24.199.123.28/32,no-resolve"
          - "IP-CIDR,64.23.132.171/32,no-resolve"
          # Overly broad / Shared LiveKit infrastructure
          - "DOMAIN-KEYWORD,openai"
          - "DOMAIN-SUFFIX,client-api.arkoselabs.com"
          - "DOMAIN-SUFFIX,host.livekit.cloud"
          - "DOMAIN-SUFFIX,turn.livekit.cloud"
      - name: "Claude"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Claude/Claude.list"
        min_rules: 2
        filter_excluded:
          - "DOMAIN,cdn.usefathom.com"
      - name: "Gemini"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Gemini/Gemini.list"
        min_rules: 5
        filter_excluded:
          # Protect shared Google services and Colab from being hijacked by Gemini AI policy
          - "DOMAIN-SUFFIX,apis.google.com"
          - "DOMAIN-KEYWORD,colab"
          - "DOMAIN-KEYWORD,developerprofiles"
          - "DOMAIN-KEYWORD,generativelanguage"
    local_custom: "rules/custom/AI-Overseas.list"

  AI-China-Direct:
    description: "Mainland China AI services (DeepSeek, etc.)"
    custom_first: true
    local_custom: "rules/custom/AI-China-Direct.list"

  GoogleDrive:
    description: "Google Drive storage services"
    custom_first: true
    max_shrink_ratio: 0.20
    sources:
      - name: "GoogleDrive"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GoogleDrive/GoogleDrive.list"
        min_rules: 5
        filter_excluded:
          # Protect shared Google API and generic user content from being hijacked by Google Drive
          - "DOMAIN,www.googleapis.com"
          - "DOMAIN-SUFFIX,googleusercontent.com"
    local_custom: "rules/custom/GoogleDrive.list"

  OneDrive:
    description: "Microsoft OneDrive services"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "OneDrive"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/OneDrive/OneDrive.list"
        min_rules: 8
    local_custom: "rules/custom/OneDrive.list"

  Google:
    description: "General Google services and infrastructure"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "Google"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Google/Google.list"
        min_rules: 100
        filter_excluded:
          - "DOMAIN-SUFFIX,googledrive.com"
          - "DOMAIN-SUFFIX,deepmind.com"
          - "IP-CIDR,172.110.32.0/21,no-resolve"
          - "IP-CIDR,216.73.80.0/20,no-resolve"
          - "IP-CIDR6,2620:120:e000::/40,no-resolve"
          - "USER-AGENT,%E4%BA%91%E7%AB%AF%E7%A1%AC%E7%9B%98*"
          - "USER-AGENT,*com.google.Drive*"
          - "USER-AGENT,Google.Drive*"
    local_custom: "rules/custom/Google.list"

  YouTube:
    description: "YouTube streaming and media services"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "YouTube"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/YouTube/YouTube.list"
        min_rules: 30
    local_custom: "rules/custom/YouTube.list"

  Telegram:
    description: "Telegram messaging platform"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "Telegram"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Telegram/Telegram.list"
        min_rules: 15
    local_custom: "rules/custom/Telegram.list"

  Twitter:
    description: "Twitter / X social platform"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "Twitter"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Twitter/Twitter.list"
        min_rules: 10
        filter_excluded:
          # Segregate Grok from Twitter main platform
          - "DOMAIN-SUFFIX,grok.com"
    local_custom: "rules/custom/Twitter.list"

  Discord:
    description: "Discord voice and chat platform"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "Discord"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Discord/Discord.list"
        min_rules: 10
    local_custom: "rules/custom/Discord.list"

  PayPal:
    description: "PayPal payment services (real operational domains only)"
    custom_first: true
    local_custom: "rules/custom/PayPal.list"

  Gaming:
    description: "Gaming platforms (Steam and Epic Games)"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "Steam"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Steam/Steam.list"
        min_rules: 20
      - name: "Epic"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Epic/Epic.list"
        min_rules: 5
    local_custom: "rules/custom/Gaming.list"

  GitHub:
    description: "GitHub development platform and services"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "GitHub"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GitHub/GitHub.list"
        min_rules: 10
    local_custom: "rules/custom/GitHub.list"

  Apple-Direct:
    description: "Apple baseline services (iCloud, CloudKit, App Store, Apple ID, HomeKit, Apple Music)"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "AppleMusic"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/AppleMusic/AppleMusic.list"
        min_rules: 10
      - name: "iCloud"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/iCloud/iCloud.list"
        min_rules: 20
      - name: "SystemOTA"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/SystemOTA/SystemOTA.list"
        min_rules: 30
    local_custom: "rules/custom/Apple-Direct.list"

  Apple-Media:
    description: "Apple media services (Apple TV+, Apple News, Fitness+)"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "AppleTV"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/AppleTV/AppleTV.list"
        min_rules: 5
      - name: "AppleNews"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/AppleNews/AppleNews.list"
        min_rules: 2
    local_custom: "rules/custom/Apple-Media.list"

  TestFlight:
    description: "Apple TestFlight beta testing platform"
    custom_first: true
    max_shrink_ratio: 0.35
    sources:
      - name: "TestFlight"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/TestFlight/TestFlight.list"
        min_rules: 2
        filter_excluded:
          - "DOMAIN,beta.apple.com"
    local_custom: "rules/custom/TestFlight.list"

  Apple-Push:
    description: "Apple Push Notification service (APNs) minimal authoritative rules"
    custom_first: true
    local_custom: "rules/custom/Apple-Push.list"

  China-Direct:
    description: "Mainland China daily apps (WeChat, Taobao, JD, Xianyu, Douyin, Bilibili, LAN)"
    custom_first: true
    max_shrink_ratio: 0.15
    sources:
      - name: "WeChat"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/WeChat/WeChat.list"
        min_rules: 30
      - name: "Alibaba"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Alibaba/Alibaba.list"
        min_rules: 50
      - name: "JingDong"
        url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/JingDong/JingDong.list"
        min_rules: 30
    local_custom: "rules/custom/China-Direct.list"

  China-GeoIP:
    description: "GeoIP catch-all for mainland China IP traffic (safety net)"
    custom_first: true
    local_custom: "rules/custom/China-GeoIP.list"

  Lan:
    description: "LAN and private network bypass (RFC1918/RFC6598)"
    custom_first: true
    local_custom: "rules/custom/Lan.list"
