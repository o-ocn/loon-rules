# ==============================================================================
# Loon Rules Shared Infrastructure & Anti-Collision Specification
# Used by scripts/check_conflicts.py to detect cross-border twin product
# collisions (e.g., Douyin vs TikTok, WeChat vs International WeChat, Apple)
# ==============================================================================

version: 1
description: "Shared infrastructure domain monitoring and conflict prevention specification"

# Trusted domestic DoH endpoints whitelist for Loon DNS plugins
trusted_domestic_dns_endpoints:
  - "https://223.5.5.5/dns-query"
  - "https://223.6.6.6/dns-query"

# Target ruleset categorizations for proxy vs direct boundary detection
ruleset_categories:
  overseas_proxy:
    - Apple-Push.lsr
    - AI-Overseas.lsr
    - YouTube.lsr
    - GoogleDrive.lsr
    - Google.lsr
    - OneDrive.lsr
    - Telegram.lsr
    - Twitter.lsr
    - Discord.lsr
    - PayPal.lsr
    - Gaming.lsr
    - GitHub.lsr
    - TestFlight.lsr
    - Apple-Media.lsr
    - TikTok.lsr # Reserved for future
  domestic_direct:
    - AI-China-Direct.lsr
    - Apple-Direct.lsr
    - China-Direct.lsr
    - Lan.lsr
    - China-GeoIP.lsr

ecosystems:
  bytedance:
    description: "ByteDance shared infrastructure (Douyin, Toutiao, Feishu vs TikTok, CapCut)"
    shared_infrastructure_domains:
      - snssdk.com
      - bytedance.com
      - byteimg.com
      - ibytedtos.com
      - bytetos.com
      - zijieapi.com
      - bytedns.net
    overseas_exclusive_domains:
      - tiktok.com
      - tiktokv.com
      - tiktokcdn.com
      - byteoversea.com
      - ibyteimg.com
      - musical.ly
    current_domestic_rulesets:
      - China-Direct.lsr
    dns_plugin_safeguards:
      - snssdk.com
      - bytedance.com

  tencent:
    description: "Tencent infrastructure (Domestic WeChat / QQ vs International WeChat)"
    shared_infrastructure_domains:
      - qq.com
      - tencent.com
      - wechat.com
    overseas_exclusive_domains:
      - voovmeeting.com
    current_domestic_rulesets:
      - China-Direct.lsr

  apple:
    description: "Apple infrastructure (Direct services vs Media / TestFlight)"
    shared_infrastructure_domains:
      - apple.com
      - icloud.com
      - mzstatic.com
    forbidden_domestic_dns_domains:
      - apple.com
      - icloud.com
    # Exact Apple CN CDN hosts only; root and wildcard DNS delegations stay forbidden.
    allowed_exact_domestic_dns_hosts:
      - cl1.apple.com
      - cl2.apple.com
      - cl3.apple.com
      - cl4.apple.com
      - cl5.apple.com
      - pancake.apple.com
      - tr.iadsdk.apple.com
      - guzzoni.smoot.apple.com
      - apps.apple.com  # Apple 官方 CN 网页源码真实嵌入 + 企业网络要求 (support.apple.com/en-us/101555)
      - amp-api-edge.apps.apple.com  # Apple 官方 CN 网页 (apps.apple.com/cn/) 真实嵌入 API 边缘端点
    domestic_rulesets:
      - Apple-Direct.lsr
      - Apple-Push.lsr
    overseas_rulesets:
      - Apple-Media.lsr
      - TestFlight.lsr
    # Subdomain delegations explicitly permitted and verified by test_20 / test_21
    allowed_subdomain_delegations:
      - push.apple.com
      - testflight.apple.com
      - beta.itunes.apple.com
      - tv.apple.com
      - linear.tv.apple.com
      - news-assets.apple.com
      - news-client.apple.com
      - news-edge.apple.com
      - news-client-search.apple.com
      - fitness.apple.com
      - amp-api.fitness.apple.com
      - gspe1-ssl.ls.apple.com
      - itunes.apple.com
      - hls-amt.itunes.apple.com
      - hls.itunes.apple.com
      - np-edge.itunes.apple.com
      - play-edge.itunes.apple.com
      - uts-api.itunes.apple.com

  alibaba:
    description: "Alibaba ecosystem (Domestic Taobao / 1688 vs AliExpress / Lazada)"
    shared_infrastructure_domains:
      - alibaba.com
      - alicdn.com
      - aliyun.com
      - alipay.com
      - aliexpress.com
    overseas_exclusive_domains:
      - lazada.com
      - daraz.com
    current_domestic_rulesets:
      - China-Direct.lsr

china_baseline_guard:
  enabled: true
  baseline_file: "rules/custom/China-Baseline.list"
  pinned_body_sha256: "8b643f2463199d2e1b7d8fbf53d44ee02f324e94747eec29df5fab747f8d2b72"
  expected_rule_count: 2599
  pinned_upstream_source_sha: "036c097eb26c6a52c4f04ebcb6633043cb942669"
  forbidden_boundary_domains:
    - windows.net
    - hotmail.com
    - live.com
    - microsoftonline.com
    - trip.com
    - bcebos.com
    - netease.com
    - cloudsigma.com
    - cncbinternational.com
    - didiglobal.com
    - tencentyun.com
    - aliyun-iot-share.com
  ambiguous_keywords:
    - cdn
    - cloud
    - dns
    - global
    - international
